name: Feature request
description: Propose a change to behaviour, tooling, or documentation.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This repo exists to demonstrate a legacy Angular app being modernized. Proposals that
        modernize `apps/portal-angular` itself work against that purpose — see AGENTS.md.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or wrong today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: apps/mock-api
        - label: apps/portal-angular
        - label: Tooling / CI / docs

  - type: dropdown
    id: contract-impact
    attributes:
      label: Does this require changing the API contract?
      options:
        - 'No'
        - 'Yes — and I have explained below why the frontend cannot be reconsidered instead'
    validations:
      required: true
