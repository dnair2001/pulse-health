name: Feature request
description: Propose a change to behaviour, tooling, or documentation.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This repo exists to demonstrate that a legacy Angular app and its React port behave
        identically against one frozen contract. Proposals that make the two diverge, or that
        modernize `apps/portal-angular`, work against that purpose — see AGENTS.md.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or wrong today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: apps/mock-api
        - label: apps/portal-angular
        - label: apps/portal-react
        - label: Tooling / CI / docs

  - type: dropdown
    id: contract-impact
    attributes:
      label: Does this require changing the API contract?
      options:
        - 'No'
        - 'Yes — and I have explained below why the frontend cannot be reconsidered instead'
    validations:
      required: true

  - type: textarea
    id: parity
    attributes:
      label: Parity plan
      description: |
        If this changes user-visible text or date rendering, how will both frontends be kept
        byte-identical?
    validations:
      required: false
