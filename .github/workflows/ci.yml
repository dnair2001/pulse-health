name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root tooling
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  api:
    name: mock-api (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/mock-api/requirements.txt
            apps/mock-api/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/mock-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: apps/mock-api
        run: ruff check .

      # ruff check . above already enforces the C90/mccabe complexity budget (see
      # pyproject.toml); these two cover the other legs of the static-analysis budget.
      - name: Dead-code check (vulture)
        working-directory: apps/mock-api
        run: vulture

      - name: Unused dependency check (pip-extra-reqs)
        working-directory: apps/mock-api
        run: pip-extra-reqs --requirements-file requirements.txt -r uvicorn app demo_server.py

      - name: Typecheck
        working-directory: apps/mock-api
        run: mypy app

      - name: Test
        working-directory: apps/mock-api
        run: pytest

      # openapi.json is committed so an agent (or a human) can read the contract offline
      # instead of needing a running server. This regenerates it and fails if the committed
      # copy has drifted from the live schema, which is the only way it stays trustworthy.
      - name: Check openapi.json is up to date
        working-directory: apps/mock-api
        run: |
          PYTHONPATH=. python scripts/generate_openapi.py
          git diff --exit-code -- openapi.json || {
            echo "::error::openapi.json is stale. Run 'npm run generate:openapi' and commit the result."
            exit 1
          }

  angular:
    name: portal-angular (eslint + tsc + karma + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/portal-angular/package-lock.json

      # karma.conf.js resolves Chrome from the puppeteer cache unless CHROME_BIN is set.
      # Pinning an explicit binary here means the specs do not depend on puppeteer's
      # postinstall download succeeding, so that download is skipped below.
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          # Karma cannot start Chrome if its shared libraries are missing; the runner image
          # happens to ship them today, but do not depend on that.
          install-dependencies: true

      - name: Install dependencies
        working-directory: apps/portal-angular
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Lint
        working-directory: apps/portal-angular
        run: npm run lint

      # eslint above already enforces complexity/max-depth/max-lines-per-function (see
      # .eslintrc.json); this covers the dead-code/unused-dependency leg of the budget.
      - name: Dead-code check (knip)
        working-directory: apps/portal-angular
        run: npm run lint:deadcode

      - name: Typecheck
        working-directory: apps/portal-angular
        run: npm run typecheck

      - name: Test
        working-directory: apps/portal-angular
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:ci

      - name: Build
        working-directory: apps/portal-angular
        run: npm run build

  quality:
    name: quality (duplicate-code budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root tooling
        run: npm ci

      # jscpd's threshold in .jscpd.json is set at the measured baseline, the same way the
      # coverage gates and complexity rules elsewhere in this repo are: it fails on new
      # duplication, not on the duplication that already existed when the gate was added.
      - name: Check duplicate code (jscpd)
        run: npm run check:duplication

  observability:
    name: observability (alerting rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install promtool
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends prometheus

      - name: Validate alerting rules
        run: promtool check rules apps/mock-api/prometheus/alerts.yml

  docs-freshness:
    name: docs (test-count freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/mock-api/requirements.txt
            apps/mock-api/requirements-dev.txt

      # scripts/check-test-count-freshness.mjs shells out to apps/mock-api/.venv/bin/pytest
      # directly (matching how every other script/doc in this repo invokes it), so the venv
      # has to exist at that path rather than relying on setup-python's global interpreter.
      - name: Install mock-api dependencies
        working-directory: apps/mock-api
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/portal-angular/package-lock.json

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install frontend dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --prefix apps/portal-angular

      - name: Check documented test counts are current
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/check-test-count-freshness.mjs

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [format, api, angular, quality, observability, docs-freshness]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
