name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root tooling
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  api:
    name: mock-api (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/mock-api/requirements.txt
            apps/mock-api/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/mock-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: apps/mock-api
        run: ruff check .

      - name: Typecheck
        working-directory: apps/mock-api
        run: mypy app

      - name: Test
        working-directory: apps/mock-api
        run: pytest

  angular:
    name: portal-angular (eslint + tsc + karma + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/portal-angular/package-lock.json

      # karma.conf.js resolves Chrome from the puppeteer cache unless CHROME_BIN is set.
      # Pinning an explicit binary here means the specs do not depend on puppeteer's
      # postinstall download succeeding, so that download is skipped below.
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          # Karma cannot start Chrome if its shared libraries are missing; the runner image
          # happens to ship them today, but do not depend on that.
          install-dependencies: true

      - name: Install dependencies
        working-directory: apps/portal-angular
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Lint
        working-directory: apps/portal-angular
        run: npm run lint

      - name: Typecheck
        working-directory: apps/portal-angular
        run: npm run typecheck

      - name: Test
        working-directory: apps/portal-angular
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:ci

      - name: Build
        working-directory: apps/portal-angular
        run: npm run build

  react-static:
    name: portal-react (oxlint + tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/portal-react/package-lock.json

      - name: Install dependencies
        working-directory: apps/portal-react
        run: npm ci

      - name: Lint
        working-directory: apps/portal-react
        run: npm run lint

      - name: Typecheck
        working-directory: apps/portal-react
        run: npm run typecheck

      - name: Build
        working-directory: apps/portal-react
        run: npm run build

  react-tests:
    name: portal-react vitest (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Invariant 4 in AGENTS.md: React's date formatting was hand-ported to match
        # Angular's, and non-UTC timezones have exposed real bugs that UTC hid.
        tz: [UTC, America/New_York]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/portal-react/package-lock.json

      - name: Install dependencies
        working-directory: apps/portal-react
        run: npm ci

      - name: Test
        working-directory: apps/portal-react
        env:
          TZ: ${{ matrix.tz }}
        run: npm run test:coverage

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [format, api, angular, react-static, react-tests]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
