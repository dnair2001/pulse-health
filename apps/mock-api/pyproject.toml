[project]
name = "pulse-health-api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
# Tracing is set up when app.main is imported, so this has to be in place before
# collection starts; that is why it lives here rather than in a fixture.
env = ["OTEL_SDK_DISABLED=true"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "app/api/__init__.py", "app/domain/__init__.py"]

[tool.coverage.report]
# Measured baseline (121 tests, `pytest --cov=app --cov-report=term-missing`): 95% overall
# (733/770 statements). app/observability/tracing.py sits at 51% because its OTLP-exporter
# branch is env-gated and off in tests (OTEL_SDK_DISABLED=true above) -- deliberately left
# uncovered rather than chased. fail_under sits a few points below the measured total so one
# new untested line doesn't fail the build, without letting coverage rot silently.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "C90"]

[tool.ruff.lint.mccabe]
# Measured baseline (`ruff check --select C90 .` with no override): zero violations at
# the ruff default threshold of 10, so the default is kept explicit here rather than
# loosened to accommodate anything -- any function crossing this bar should be refactored.
max-complexity = 10

[tool.vulture]
# Measured baseline (`vulture app --min-confidence 60`): every hit below 80% confidence is a
# FastAPI/Pydantic framework-required symbol (route handlers only called by the router, Pydantic
# `model_config`/field declarations only read by the framework, exception handlers registered via
# decorator). None are real dead code, so confidence is raised to 80 -- where the run is already
# clean -- instead of hand-whitelisting every framework pattern.
paths = ["app"]
min_confidence = 80

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
pretty = true
show_error_codes = true
