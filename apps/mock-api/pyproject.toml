[project]
name = "pulse-health-api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
# Tracing is set up when app.main is imported, so this has to be in place before
# collection starts; that is why it lives here rather than in a fixture.
env = ["OTEL_SDK_DISABLED=true"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "app/api/__init__.py", "app/domain/__init__.py"]

[tool.coverage.report]
# Measured baseline (121 tests, `pytest --cov=app --cov-report=term-missing`): 95% overall
# (733/770 statements). app/observability/tracing.py sits at 51% because its OTLP-exporter
# branch is env-gated and off in tests (OTEL_SDK_DISABLED=true above) -- deliberately left
# uncovered rather than chased. fail_under sits a few points below the measured total so one
# new untested line doesn't fail the build, without letting coverage rot silently.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
pretty = true
show_error_codes = true
