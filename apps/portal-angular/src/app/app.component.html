<div class="shell">
  <header class="shell__header">
    <a href="/providers" class="shell__brand">
      <span class="shell__logo" aria-hidden="true">◆</span>
      <span class="shell__name">Pulse Health</span>
      <span class="shell__tag">Patient portal</span>
    </a>
    <nav class="shell__nav">
      <a
        href="/providers"
        ng-class="{ 'shell__link--active': $ctrl.isActive('/providers') }"
        class="shell__link"
      >
        Providers
      </a>
    </nav>
    <span class="shell__patient" data-testid="patient-name">{{ $ctrl.patientName }}</span>
  </header>

  <main class="shell__main">
    <div ng-view></div>
  </main>

  <footer class="shell__footer">
    Pulse Health demo environment. Data resets when the mock API store is cleared.
  </footer>
</div>
