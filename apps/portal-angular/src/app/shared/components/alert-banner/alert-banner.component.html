<div
  ng-class="$ctrl.cssClass"
  role="{{ $ctrl.role }}"
  data-variant="{{ $ctrl.variant }}"
  data-testid="alert-banner"
>
  <span class="alert__message">{{ $ctrl.message }}</span>
  <button
    type="button"
    class="alert__dismiss"
    ng-if="$ctrl.dismissible"
    aria-label="Dismiss"
    ng-click="$ctrl.dismissed()"
  >
    ×
  </button>
</div>
