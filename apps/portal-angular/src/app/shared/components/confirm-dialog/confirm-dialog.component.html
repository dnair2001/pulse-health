<div class="dialog-backdrop" ng-if="$ctrl.open">
  <div class="dialog" role="dialog" aria-modal="true" aria-label="{{ $ctrl.title }}" data-testid="confirm-dialog">
    <h2 class="dialog__title">{{ $ctrl.title }}</h2>
    <p class="dialog__message" ng-if="$ctrl.message">{{ $ctrl.message }}</p>
    <div class="dialog__actions">
      <button
        type="button"
        class="button button--ghost"
        ng-disabled="$ctrl.busy"
        ng-click="$ctrl.cancelled()"
        data-testid="confirm-cancel"
      >
        {{ $ctrl.cancelLabel }}
      </button>
      <button
        type="button"
        class="button button--danger"
        ng-disabled="$ctrl.busy"
        ng-click="$ctrl.confirmed()"
        data-testid="confirm-accept"
      >
        {{ $ctrl.busy ? 'Working…' : $ctrl.confirmLabel }}
      </button>
    </div>
  </div>
</div>
