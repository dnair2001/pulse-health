<section class="page" ng-if="!$ctrl.loading">
  <header class="page__header">
    <button type="button" class="button button--ghost" ng-click="$ctrl.goBack()" data-testid="back">
      &larr; Back to directory
    </button>
  </header>

  <div class="stack" ng-if="$ctrl.error">
    <ph-alert-banner
      variant="error"
      message="{{ $ctrl.error.message }}"
      dismissible="false"
    ></ph-alert-banner>
  </div>

  <article class="card" ng-if="$ctrl.provider" data-testid="provider-profile">
    <h1 class="page__title">{{ $ctrl.provider.name }}</h1>
    <p class="page__subtitle">{{ $ctrl.provider.specialty }}, {{ $ctrl.provider.credentials }}</p>
    <p class="provider-profile__location">{{ $ctrl.provider.locationName }}</p>
    <!--
      Bios come from the internal onboarding tool and may contain basic formatting
      (<strong>, <br>) that plain interpolation would render as literal tags instead of
      escaping them. ng-bind-html runs the value through ngSanitize's $sanitize service
      (loaded as a module dependency, see app.module.js), which strips anything not on its
      safe-tag/safe-attribute allowlist -- e.g. a <script> or an onerror= handler -- rather
      than trusting the string outright the way $sce.trustAsHtml would. There is no
      user-facing way to edit a bio from this portal.
    -->
    <div class="provider-profile__bio" ng-bind-html="$ctrl.provider.bio" data-testid="provider-bio"></div>
  </article>
</section>

<ph-loading-spinner ng-if="$ctrl.loading" message="Loading provider…"></ph-loading-spinner>
