<section class="page">
  <header class="page__header">
    <div>
      <h1 class="page__title">Provider directory</h1>
      <p class="page__subtitle">Meet the clinicians at Pulse Health.</p>
    </div>
  </header>

  <label class="field">
    <span class="field__label">Search by name or specialty</span>
    <input
      type="search"
      ng-model="$ctrl.search"
      placeholder="e.g. Dermatology"
      data-testid="provider-search"
    />
  </label>

  <ph-loading-spinner ng-if="$ctrl.loading" message="Loading providers…"></ph-loading-spinner>

  <div class="stack" ng-if="$ctrl.error && !$ctrl.loading">
    <ph-alert-banner
      variant="error"
      message="{{ $ctrl.error.message }}"
      dismissible="false"
    ></ph-alert-banner>
    <button type="button" class="button button--ghost" ng-click="$ctrl.load()" data-testid="retry">
      Try again
    </button>
  </div>

  <ph-empty-state
    ng-if="$ctrl.isEmpty"
    title="No providers match your search"
    message="Try a different name or specialty."
  ></ph-empty-state>

  <div
    class="provider-grid"
    ng-if="!$ctrl.loading && !$ctrl.error && $ctrl.filteredProviders.length > 0"
  >
    <button
      type="button"
      class="card provider-card"
      ng-repeat="provider in $ctrl.filteredProviders"
      ng-click="$ctrl.viewProfile(provider)"
      data-testid="provider-card-{{ provider.id }}"
    >
      <h2 class="card__title">{{ provider.name }}</h2>
      <p class="provider-card__specialty">{{ provider.specialty }}, {{ provider.credentials }}</p>
      <p class="provider-card__location">{{ provider.locationName }}</p>
    </button>
  </div>
</section>
