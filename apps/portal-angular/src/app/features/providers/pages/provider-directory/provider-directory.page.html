<section class="page">
  <header class="page__header">
    <div>
      <h1 class="page__title">Provider directory</h1>
      <p class="page__subtitle">Meet the clinicians at Pulse Health.</p>
    </div>
  </header>

  <label class="field">
    <span class="field__label">Search by name or specialty</span>
    <input
      type="search"
      [(ngModel)]="search"
      placeholder="e.g. Dermatology"
      data-testid="provider-search"
    />
  </label>

  <ph-loading-spinner *ngIf="loading" message="Loading providers…"></ph-loading-spinner>

  <div class="stack" *ngIf="error && !loading">
    <ph-alert-banner
      [variant]="'error'"
      [message]="error.message"
      [dismissible]="false"
    ></ph-alert-banner>
    <button type="button" class="button button--ghost" (click)="load()" data-testid="retry">
      Try again
    </button>
  </div>

  <ph-empty-state
    *ngIf="isEmpty"
    title="No providers match your search"
    message="Try a different name or specialty."
  ></ph-empty-state>

  <div class="provider-grid" *ngIf="!loading && !error && filteredProviders.length > 0">
    <button
      type="button"
      class="card provider-card"
      *ngFor="let provider of filteredProviders"
      (click)="viewProfile(provider)"
      [attr.data-testid]="'provider-card-' + provider.id"
    >
      <h2 class="card__title">{{ provider.name }}</h2>
      <p class="provider-card__specialty">{{ provider.specialty }}, {{ provider.credentials }}</p>
      <p class="provider-card__location">{{ provider.locationName }}</p>
    </button>
  </div>
</section>
