<section class="page">
  <header class="page__header">
    <div>
      <h1 class="page__title">Schedule an appointment</h1>
      <p class="page__subtitle">Pick a provider, choose an open time, and tell us why you're coming in.</p>
    </div>
  </header>

  <ph-alert-banner
    *ngIf="referenceError"
    [variant]="'error'"
    [message]="referenceError.message"
    [dismissible]="false"
  ></ph-alert-banner>

  <ph-alert-banner
    *ngIf="serverError"
    [variant]="'error'"
    [message]="serverError.message"
    (dismissed)="serverError = null"
  ></ph-alert-banner>

  <ph-loading-spinner
    *ngIf="loadingReferenceData"
    message="Loading providers…"
  ></ph-loading-spinner>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loadingReferenceData">
    <label class="field">
      <span class="field__label">Provider</span>
      <select formControlName="providerId" data-testid="provider-select">
        <option value="">Choose a provider</option>
        <option *ngFor="let provider of providers" [value]="provider.id">
          {{ provider.name }} · {{ provider.specialty }}
        </option>
      </select>
      <span class="field__error" *ngIf="controlHasError('providerId', 'required')">
        Please choose a provider.
      </span>
    </label>

    <fieldset class="field">
      <legend class="field__label">Available times</legend>
      <ph-slot-picker formControlName="slotId" [slots]="slots" [loading]="loadingSlots"></ph-slot-picker>
      <span class="field__error" *ngIf="controlHasError('slotId', 'required')" data-testid="slot-error">
        Please choose a time slot.
      </span>
      <span class="field__error" *ngIf="serverMessageFor('slotId')" data-testid="slot-server-error">
        {{ serverMessageFor('slotId') }}
      </span>
    </fieldset>

    <label class="field">
      <span class="field__label">Visit type</span>
      <select formControlName="visitType" data-testid="visit-type-select">
        <option value="">Choose a visit type</option>
        <option *ngFor="let visitType of visitTypes" [value]="visitType.id">
          {{ visitType.label }} ({{ visitType.durationMinutes }} min)
        </option>
      </select>
      <span class="field__error" *ngIf="controlHasError('visitType', 'required')">
        Please choose a visit type.
      </span>
    </label>

    <label class="field">
      <span class="field__label">Reason for visit</span>
      <textarea
        formControlName="reason"
        rows="4"
        [attr.maxlength]="reasonMaxLength"
        placeholder="Annual physical, follow-up on lab results, persistent cough…"
        data-testid="reason-input"
      ></textarea>
      <span class="field__error" *ngIf="controlHasError('reason', 'required')" data-testid="reason-error">
        A reason for the visit is required.
      </span>
      <span class="field__error" *ngIf="controlHasError('reason', 'minlength')">
        Please add a little more detail.
      </span>
    </label>

    <div class="form__actions">
      <button type="button" class="button button--ghost" (click)="cancel()">Back</button>
      <button
        type="submit"
        class="button button--primary"
        [disabled]="submitting"
        data-testid="submit-appointment"
      >
        {{ submitting ? 'Scheduling…' : 'Confirm appointment' }}
      </button>
    </div>
  </form>
</section>
