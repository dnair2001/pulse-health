<div class="slot-picker" data-testid="slot-picker">
  <ph-loading-spinner *ngIf="loading" message="Loading available times…"></ph-loading-spinner>

  <p class="slot-picker__empty" *ngIf="!loading && groups.length === 0" data-testid="slot-picker-empty">
    No open time slots for this provider. Try another provider.
  </p>

  <div class="slot-picker__day" *ngFor="let group of groups">
    <h4 class="slot-picker__date">{{ group.day | date: 'EEEE d MMMM' }}</h4>
    <div class="slot-picker__times">
      <button
        type="button"
        *ngFor="let slot of group.slots"
        class="slot"
        [class.slot--selected]="slot.id === selectedSlotId"
        [disabled]="disabled"
        [attr.aria-pressed]="slot.id === selectedSlotId"
        [attr.data-testid]="'slot-' + slot.id"
        (click)="select(slot)"
      >
        {{ slot.startsAt | date: 'HH:mm' }}
      </button>
    </div>
  </div>
</div>
