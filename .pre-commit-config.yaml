# Install with: apps/mock-api/.venv/bin/pre-commit install
# Run over everything with: apps/mock-api/.venv/bin/pre-commit run --all-files
#
# Every linter/formatter hook is `language: system` and invokes the binary this repo
# already installs (apps/mock-api/.venv, or the per-app node_modules). That keeps commits
# fast and offline: pre-commit builds no isolated environments for them.
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit]
fail_fast: false

# The copied stylesheets and the Angular templates are excluded from every whitespace
# rewriting hook below. apps/portal-react/src/styles/global.scss is a verbatim copy: its
# first 413 lines are apps/portal-angular/src/styles.scss and its last 68 are
# apps/portal-angular/src/app/app.component.scss. Byte-equality of those three files, and
# the rendered whitespace of the templates, are invariants (see AGENTS.md invariant 3), so
# a stray trailing-whitespace or final-newline fix there is a defect, not a cleanup.
exclude: |
  (?x)^(
    apps/portal-react/src/styles/global\.scss|
    apps/portal-angular/src/styles\.scss|
    apps/portal-angular/src/app/app\.component\.scss|
    .*\.html
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # These are JSON-with-comments (tsconfig, devcontainer, VS Code, and the ESLint/oxlint
        # configs' measured-threshold rationale comments); a strict JSON parser rejects them
        # even though every tool that reads them accepts comments.
        exclude: |
          (?x)^(
            \.devcontainer/devcontainer\.json|
            apps/portal-angular/\.vscode/.*\.json|
            apps/.*/tsconfig.*\.json|
            apps/portal-angular/\.eslintrc\.json|
            apps/portal-react/\.oxlintrc\.json
          )$
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (mock-api)
        entry: apps/mock-api/.venv/bin/ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        files: ^apps/mock-api/

      - id: ruff-format
        name: ruff format (mock-api)
        entry: apps/mock-api/.venv/bin/ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^apps/mock-api/

      - id: mypy
        name: mypy (mock-api)
        # Whole-package check: mypy needs the package, not a file list, to resolve imports.
        entry: bash -c 'cd apps/mock-api && .venv/bin/mypy app'
        language: system
        pass_filenames: false
        files: ^apps/mock-api/app/.*\.py$

      - id: vulture
        name: vulture (mock-api dead code)
        # Whole-package check, same reason as mypy above: vulture needs the whole usage
        # graph, not a file list, to tell real dead code from a symbol only used elsewhere.
        entry: bash -c 'cd apps/mock-api && .venv/bin/vulture'
        language: system
        pass_filenames: false
        files: ^apps/mock-api/app/.*\.py$

      - id: pip-extra-reqs
        name: pip-extra-reqs (mock-api unused deps)
        entry: bash -c 'cd apps/mock-api && .venv/bin/pip-extra-reqs --requirements-file
          requirements.txt -r uvicorn app demo_server.py'
        language: system
        pass_filenames: false
        files: ^apps/mock-api/(app/.*\.py|demo_server\.py|requirements.*\.txt)$

      - id: oxlint
        name: oxlint (portal-react)
        entry: apps/portal-react/node_modules/.bin/oxlint
        language: system
        files: ^apps/portal-react/src/.*\.(ts|tsx|js|jsx)$

      - id: knip-react
        name: knip (portal-react dead code)
        # Whole-project check, same reason as vulture above. knip resolves its config and
        # entry points relative to the current directory, not the entry binary's path, so
        # this needs an explicit cd the same way mypy's hook does.
        entry: bash -c 'cd apps/portal-react && node_modules/.bin/knip'
        language: system
        pass_filenames: false
        files: ^apps/portal-react/(src/.*\.(ts|tsx)|package\.json)$

      - id: eslint-angular
        name: eslint (portal-angular)
        entry: apps/portal-angular/node_modules/.bin/eslint --resolve-plugins-relative-to
          apps/portal-angular
        language: system
        files: ^apps/portal-angular/src/.*\.ts$

      - id: knip-angular
        name: knip (portal-angular dead code)
        # Same reason as knip-react above: knip needs to run from the app directory.
        entry: bash -c 'cd apps/portal-angular && node_modules/.bin/knip'
        language: system
        pass_filenames: false
        files: ^apps/portal-angular/(src/.*\.ts|package\.json)$

      - id: jscpd
        name: jscpd (duplicate code, all apps)
        entry: node_modules/.bin/jscpd -c .jscpd.json
        language: system
        pass_filenames: false
        files: \.(py|ts|tsx|html)$

      - id: prettier
        name: prettier
        entry: node_modules/.bin/prettier --write --ignore-unknown
        language: system
        types_or: [ts, tsx, javascript, json, yaml, markdown]
