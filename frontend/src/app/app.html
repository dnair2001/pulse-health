<div class="min-h-screen bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-3xl items-center gap-6 px-6 py-4">
      <span class="font-semibold tracking-tight">{{ title() }}</span>
      <a
        routerLink="/"
        routerLinkActive="text-slate-900 font-medium"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-sm text-slate-500 transition hover:text-slate-900"
        >Home</a
      >
      <a
        routerLink="/about"
        routerLinkActive="text-slate-900 font-medium"
        class="text-sm text-slate-500 transition hover:text-slate-900"
        >About</a
      >
    </nav>
  </header>

  <main class="mx-auto max-w-3xl px-6 py-10">
    <router-outlet />
  </main>
</div>
